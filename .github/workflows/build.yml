name: Build SIMULADOR CKP

on:
  push:
    branches: [ main, "copilot/**" ]
  pull_request:
    branches: [ main ]

# Restrict default token permissions to read-only
permissions:
  contents: read

jobs:
  build:
    name: Compile for ATmega328P
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build firmware
        run: pio run

      - name: Report binary sizes
        run: pio run --target size

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: simulador-ckp-firmware
          path: .pio/build/nano_atmega328/*.hex
          if-no-files-found: error

  unit-tests:
    name: Native logic unit tests (x86)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build unit tests
        run: |
          g++ -std=c++11 -Wall -Wextra -Wno-unused-parameter \
              -o /tmp/test_ckp \
              tests/test_firmware_logic.cpp

      - name: Run unit tests
        run: /tmp/test_ckp
