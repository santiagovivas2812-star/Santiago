; PlatformIO configuration for SIMULADOR CKP
; Target: Arduino Nano (ATmega328P @ 16 MHz)
;
; Build:   pio run
; Size:    pio run --target size
; Upload:  pio run --target upload

[env:nano_atmega328]
platform  = atmelavr
board     = nanoatmega328
framework = arduino

; Lock to the 5 V / 16 MHz Nano variant
board_build.mcu   = atmega328p
board_build.f_cpu = 16000000L

; Dependencies
lib_deps =
    arduino-libraries/LiquidCrystal@^1.0.7

; Compiler flags
build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
    -std=gnu++11
    -Os

; Treat all warnings as errors in CI (remove locally if needed)
; build_flags =
;     ...
;     -Werror
